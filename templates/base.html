<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TensorX Clinical AI</title>
    
    <!-- External Assets -->
    <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom Theme Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --slate-900: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Smooth UI Transitions */
        .ui-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Mobile Tap Targets */
        button, a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

        /* Lead Grid Background (Simulated ECG Paper) */
        .ecg-grid {
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 selection:bg-blue-100">

    {% include "navbar.html" %}

    <div class="p-4 md:p-8 max-w-[1600px] mx-auto">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
