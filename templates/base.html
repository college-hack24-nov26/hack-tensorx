<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TensorX Clinical AI</title>
    
    <!-- External Assets -->
    <script src="https://cdn.plot.ly/plotly-2.35.3.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Custom Theme Styles -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --slate-900: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Smooth UI Transitions */
        .ui-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Mobile Tap Targets */
        button, a { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

        /* Markdown rendered content inside chat bubbles */
        .prose-chat h1, .prose-chat h2, .prose-chat h3 {
            font-weight: 800;
            color: #1e293b;
            margin-top: 1rem;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }
        .prose-chat h1 { font-size: 1rem; }
        .prose-chat h2 { font-size: 0.9rem; }
        .prose-chat h3 { font-size: 0.85rem; }
        .prose-chat p  { font-size: 0.8rem; color: #334155; margin-bottom: 0.5rem; line-height: 1.6; }
        .prose-chat ul, .prose-chat ol { padding-left: 1.2rem; margin-bottom: 0.5rem; }
        .prose-chat li { font-size: 0.8rem; color: #334155; margin-bottom: 0.25rem; line-height: 1.5; }
        .prose-chat strong { font-weight: 700; color: #0f172a; }
        .prose-chat em { font-style: italic; color: #475569; }
        .prose-chat code { background: #e2e8f0; border-radius: 4px; padding: 1px 5px; font-size: 0.75rem; font-family: monospace; }
        .prose-chat pre { background: #1e293b; color: #e2e8f0; border-radius: 10px; padding: 0.75rem 1rem; overflow-x: auto; margin-bottom: 0.5rem; }
        .prose-chat pre code { background: none; padding: 0; color: inherit; }
        .prose-chat table { width: 100%; border-collapse: collapse; margin-bottom: 0.75rem; font-size: 0.78rem; }
        .prose-chat th { background: #f1f5f9; font-weight: 700; color: #1e293b; padding: 6px 10px; border: 1px solid #e2e8f0; text-align: left; }
        .prose-chat td { padding: 5px 10px; border: 1px solid #e2e8f0; color: #334155; vertical-align: top; }
        .prose-chat tr:nth-child(even) td { background: #f8fafc; }
        .prose-chat blockquote { border-left: 3px solid #6366f1; padding-left: 0.75rem; color: #64748b; font-style: italic; margin-bottom: 0.5rem; }
        .prose-chat a { color: #6366f1; text-decoration: underline; font-size: 0.78rem; }
        .prose-chat hr { border: none; border-top: 1px solid #e2e8f0; margin: 0.75rem 0; }

        /* Lead Grid Background (Simulated ECG Paper) */
        .ecg-grid {
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 selection:bg-blue-100">

    {% include "navbar.html" %}

    <div class="p-4 md:p-8 max-w-[1600px] mx-auto">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
