{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-slate-200">
    <div class="mb-8">
        <h2 class="text-xl font-bold mb-2 flex items-center gap-2">
            <i class="fas fa-file-upload text-blue-500"></i>
            Step 1: Upload ECG Data
        </h2>
        <p class="text-slate-500 text-sm mb-4">Select a .json (array) or .csv (signal column) file to analyze.</p>
        
        <div class="flex items-center gap-4">
            <input type="file" id="fileInput" class="block w-full text-sm text-slate-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100 cursor-pointer">
            <button onclick="upload()" id="analyzeBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full transition-all flex items-center gap-2">
                Analyze Signal
            </button>
        </div>
    </div>

    <div id="errorDisplay" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"></div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="md:col-span-2">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fas fa-chart-line text-slate-400"></i>
                Signal Visualization
            </h2>
            <div id="plot" class="w-full h-[400px] border border-slate-100 rounded-xl bg-slate-50 flex items-center justify-center">
                <span class="text-slate-400 text-sm">Upload a file to see the waveform</span>
            </div>
        </div>
        
        <div class="md:col-span-1">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i class="fas fa-microchip text-slate-400"></i>
                AI Diagnosis
            </h2>
            <div id="result" class="h-[400px] border border-slate-100 rounded-xl bg-slate-50 p-6 flex flex-col items-center justify-center text-center">
                <i class="fas fa-robot text-4xl text-slate-200 mb-4"></i>
                <p class="text-slate-400 text-sm">Awaiting data analysis...</p>
            </div>
        </div>
    </div>
</div>

<script>
async function upload() {
    const fileInput = document.getElementById("fileInput");
    const errorDisplay = document.getElementById("errorDisplay");
    const analyzeBtn = document.getElementById("analyzeBtn");
    
    if (!fileInput.files[0]) return alert("Please select a file first");
    
    errorDisplay.classList.add('hidden');
    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
    
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);

    try {
        const response = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Server error occurred");
        }

        // 1. Update Diagnosis UI
        const isWarning = data.prediction !== 'NSR';
        document.getElementById("result").innerHTML = `
            <div class="w-full animate-in fade-in duration-500">
                <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Detected Rhythm</div>
                <div class="text-3xl font-black ${isWarning ? 'text-orange-600' : 'text-emerald-600'} mb-6">
                    ${data.prediction}
                </div>
                <div class="space-y-4 text-left">
                    ${Object.entries(data.probabilities).map(([cls, prob]) => `
                        <div>
                            <div class="flex justify-between text-[10px] font-bold mb-1 uppercase">
                                <span>${cls}</span>
                                <span>${(prob * 100).toFixed(1)}%</span>
                            </div>
                            <div class="w-full bg-white h-1.5 rounded-full overflow-hidden border border-slate-100">
                                <div class="h-full ${cls === data.prediction ? (isWarning ? 'bg-orange-500' : 'bg-emerald-500') : 'bg-slate-200'}" 
                                     style="width: ${prob * 100}%"></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        document.getElementById("result").className = `h-[400px] border rounded-xl p-6 flex flex-col items-center justify-center text-center transition-all ${isWarning ? 'bg-orange-50 border-orange-100' : 'bg-emerald-50 border-emerald-100'}`;

        // 2. Plotting Logic
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const text = e.target.result;
                let arr = [];
                
                if (file.name.endsWith('.json')) {
                    arr = JSON.parse(text);
                } else {
                    // Robust CSV parsing for the demo
                    arr = text.split(/[\n,]/)
                              .map(v => v.trim())
                              .filter(v => v !== "")
                              .map(v => parseFloat(v))
                              .filter(v => !isNaN(v));
                }

                if (arr.length === 0) throw new Error("No numeric data found in file for plotting");

                Plotly.newPlot("plot", [{
                    y: arr,
                    type: "scatter",
                    mode: "lines",
                    line: { color: isWarning ? '#f97316' : '#10b981', width: 2 }
                }], {
                    margin: { l: 40, r: 20, t: 20, b: 40 },
                    xaxis: { title: 'Time (samples)', gridcolor: '#f1f5f9' },
                    yaxis: { title: 'Amplitude', gridcolor: '#f1f5f9' },
                    plot_bgcolor: 'transparent',
                    paper_bgcolor: 'transparent',
                    autosize: true
                }, { responsive: true, displayModeBar: false });
            } catch (err) {
                console.error("Plotting error:", err);
                errorDisplay.innerText = "Error visualizing data: " + err.message;
                errorDisplay.classList.remove('hidden');
            }
        };
        reader.readAsText(file);

    } catch (err) {
        errorDisplay.innerText = err.message;
        errorDisplay.classList.remove('hidden');
    } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = 'Analyze Signal';
    }
}
</script>
{% endblock %}
